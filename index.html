<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtual Lab AR</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f4f4f9; }
    model-viewer { width: 100vw; height: 75vh; }
    .controls { height: 25vh; display: flex; justify-content: center; align-items: center; gap: 15px; background: #fff; }
    button { padding: 12px 20px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; }
    .btn-play { background: #28a745; color: white; }
  </style>
</head>
<body>

  <model-viewer src="scene.gltf" ar ar-modes="webxr scene-viewer quick-look" camera-controls auto-rotate shadow-intensity="1">
    <button slot="ar-button" style="background: #007bff; color: white; padding: 10px 15px; border-radius: 5px; border: none; position: absolute; top: 15px; right: 15px;">
      📱 Xem trong AR
    </button>
  </model-viewer>

  <div class="controls">
    <button class="btn-play" onclick="playAudio('intro.mp3')">▶️ Bắt đầu thuyết minh</button>
  </div>

  <script>
    let audio = null;
    function playAudio(file) {
      if (audio) audio.pause();
      audio = new Audio(file);
      audio.play();
    }
  </script>

</body>
</html>
